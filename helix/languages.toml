[language-server.pylsp.config.pylsp.plugins]
pylint.enabled = true
pyflakes.enabled = true
pyls_mypy.enabled = true

# Defaults, plus:
# E203: whitespace before ":"
# E402: module level import not at top of file
# E731: do not assign a lambda expression, use a def
[language-server.pylsp.config.pylsp.plugins.pycodestyle]
ignore = ["E731", "E402", "E203", "E121", "E123", "E126", "E133", "E226", "E241", "E242", "E704", "W503", "W504", "W505"]
maxLineLength = 88

[language-server.clangd]
args = ["-header-insertion=never"]

[language-server.tailwindcss-ls]
config = { userLanguages = { heex = "html", "*.html.heex" = "html", elixir = "html", "*.ex" = "html" } }

[language-server.harper-ls]
command = "harper-ls"
args = ["--stdio"]

# Language definitions

[[language]]
name = "python"
auto-format = true
formatter = { command = "black", args = ["-", "--quiet", "--line-length=88"] }

[[language]]
name = "cpp"
auto-format = true
formatter = { command = "clang-format" }

[[language]]
name = "c"
auto-format = true
file-types = ["c", "h"]
formatter = { command = "clang-format" }

[[language]]
name = "elixir"
auto-format = true
scope = "source.elixir"
injection-regex = "(elixir|ex)"
file-types = ["ex", "exs", "mix.lock", "html.heex"]
shebangs = ["elixir"]
roots = ["mix.exs", "mix.lock"]
comment-token = "#"
indent = { tab-width = 2, unit = "  " }
language-servers = [ "elixir-ls", "tailwindcss-ls" ]
formatter = { command = "mixmaster" }
diagnostic-severity = "hint"

[[language]]
name = "heex"
auto-format = true
scope = "source.heex"
injection-regex = "heex"
file-types = ["heex"]
roots = ["mix.exs", "mix.lock"]
indent = { tab-width = 2, unit = "  " }
language-servers = [ "elixir-ls", "tailwindcss-ls" ]

[[language]]
name = "slint"
auto-format = true
scope = "source.slint"

[[language]]
name = "rust"
scope = "source.rust"
injection-regex = "rust"
file-types = ["rs"]
roots = ["Cargo.toml", "Cargo.lock"]
auto-format = true
language-servers = ["rust-analyzer", "harper-ls"]
indent = { tab-width = 4, unit = "    " }

[language-server.rust-analyzer]
command = "rust-analyzer"

[language-server.rust-analyzer.config]
check.command = "clippy"
diagnostics.enable = true
